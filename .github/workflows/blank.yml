name: Update Ticket Assignee

on:
  workflow_dispatch:
    inputs:
      ticket_id:
        description: 'Zendesk Ticket Number'
        required: true
        default: '2045'
      assignee_email:
        description: 'New Assignee Email'
        required: true
        default: 'lead-dev@techcorp.com'

jobs:
  mock_update:
    runs-on: ubuntu-latest
    steps:
      - name: Simulate API Call to Zendesk
        run: |
          echo "======================================="
          echo "Connecting to Zendesk API..."
          echo "Target Ticket: #${{ github.event.inputs.ticket_id }}"
          echo "New Assignee: ${{ github.event.inputs.assignee_email }}"
          echo "======================================="
          echo "Mock API Response: 200 OK"
          echo "Success: Ticket has been reassigned successfully!"

